      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: coding-interview-university
        path: README.md
        heading: Algorithmic complexity / Big-O / Asymptotic analysis
      estimated_minutes: 150
      completion_criteria: Distinguish Big-O, Omega, and Theta on common loops and nested loops.
      suggested_order: 1
      depends_on:
      - ie-baseline-diagnostic
      difficulty:
        level: beginner
        score: 1
      cognitive_load: medium
    - id: ciu-amortized-analysis
      title: Understand amortized analysis
      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: coding-interview-university
        path: README.md
        heading: Algorithmic complexity / Big-O / Asymptotic analysis
      estimated_minutes: 90
      completion_criteria: Explain dynamic array resizing and hash table insertion costs using amortized terms.
      suggested_order: 2
      depends_on:
      - ciu-asymptotic-notation
      difficulty:
        level: beginner
        score: 1
      cognitive_load: low
    - id: ciu-recurrence-relations
      title: Practice recurrence relations and divide-and-conquer costs
      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: coding-interview-university
        path: README.md
        heading: Algorithmic complexity / Big-O / Asymptotic analysis
      estimated_minutes: 120
      completion_criteria: Solve simple recurrences for binary search, merge sort, and tree traversal.
      suggested_order: 3
      depends_on:
      - ciu-amortized-analysis
      difficulty:
        level: beginner
        score: 1
      cognitive_load: medium
    - id: ciu-complexity-cheat-sheet-review
      title: Review common data structure and algorithm costs
      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: coding-interview-university
        path: README.md
        heading: Algorithmic complexity / Big-O / Asymptotic analysis
      estimated_minutes: 75
      completion_criteria: Produce a one-page lookup table from memory, then correct it against the source references.
      suggested_order: 4
      depends_on:
      - ciu-recurrence-relations
      difficulty:
        level: beginner
        score: 1
      cognitive_load: low
    - id: icc-time-space-tradeoff-drills
      title: Drill time-space tradeoffs
      type:
        category: coding-exercise
        medium: notebook
        interaction: active
      source:
        repo: interactive-coding-challenges
        path: arrays_strings/two_sum/two_sum_challenge.ipynb
      estimated_minutes: 120
      completion_criteria: Implement brute-force and hash-based variants and compare complexity.
      suggested_order: 5
      depends_on:
      - ciu-complexity-cheat-sheet-review
      difficulty:
        level: beginner
        score: 1
      cognitive_load: medium
    - id: ie-explain-before-code-checkpoint
      title: Explain-before-code checkpoint
      type:
        category: checkpoint
        medium: manifest
        interaction: reflective
      inferred: true
      source:
        repo: coding-interview-university
        path: README.md
        heading: Coding Question Practice
      estimated_minutes: 180
      completion_criteria: Solve three unseen problems by stating constraints, approach, complexity, and tests before coding.
      suggested_order: 6
      depends_on:
      - icc-time-space-tradeoff-drills
      difficulty:
        level: beginner
        score: 1
      cognitive_load: medium
    suggested_order: 2
    depends_on:
    - ie-module-foundations-and-study-setup
