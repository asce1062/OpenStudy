meta:
  id: ie-curriculum-interview-engineering
  name: Interview Engineering
  description: Comprehensive software engineering interview preparation track
  timezone: Africa/Nairobi
  version: 1
  owner: Alex Mbugua
  format: openstudy-curriculum-manifest
  status: draft
  attribution_note: 'This manifest is an original study plan that references local source repositories by path and heading.
    It intentionally avoids copying large portions of upstream content.

    '
  schema_version: 2
  id_policy:
    format: stable-global-kebab-case
    lesson_prefixes:
      ciu: Coding Interview University sourced lesson
      icc: Interactive Coding Challenges sourced lesson
      sdp: System Design Primer sourced lesson
      ie: OpenStudy inferred curriculum checkpoint or project
sources:
- id: coding-interview-university
  name: Coding Interview University
  path: curriculum/sources/coding-interview-university
  upstream: https://github.com/jwasham/coding-interview-university
- id: system-design-primer
  name: System Design Primer
  path: curriculum/sources/system-design-primer
  upstream: https://github.com/donnemartin/system-design-primer
- id: interactive-coding-challenges
  name: Interactive Coding Challenges
  path: curriculum/sources/interactive-coding-challenges
  upstream: https://github.com/donnemartin/interactive-coding-challenges
tracks:
- id: ie-track-core
  name: Interview Engineering Core
  description: 'A practical path from interview study setup through algorithms, coding challenge fluency, system design fundamentals,
    and mock interview readiness.

    '
  audience: personal software engineering interview preparation
  suggested_order: 1
  modules:
  - id: ie-module-foundations-and-study-setup
    name: Foundations and Study Setup
    description: Establish the study workflow, interview scope, tools, and baseline habits.
    difficulty:
      level: beginner
      score: 1
    tags:
    - planning
    - study-skills
    - interview-prep
    - workflow
    prerequisites: []
    lessons:
    - id: ciu-understand-the-study-plan
      title: Understand the study plan and expectations
      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: coding-interview-university
        path: README.md
        heading: The Study Plan
      estimated_minutes: 60
      completion_criteria: Summarize the main phases, weekly commitment, and personal constraints.
      suggested_order: 1
      depends_on: []
      difficulty:
        level: beginner
        score: 1
      cognitive_load: low
    - id: ciu-choose-primary-language
      title: Choose and configure the primary interview language
      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: coding-interview-university
        path: README.md
        heading: Choose a Programming Language
      estimated_minutes: 75
      completion_criteria: Pick one language and record its testing, debugging, and notebook workflow.
      suggested_order: 2
      depends_on:
      - ciu-understand-the-study-plan
      difficulty:
        level: beginner
        score: 1
      cognitive_load: low
    - id: icc-set-up-coding-challenge-workflow
      title: Set up the coding challenge workflow
      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: interactive-coding-challenges
        path: README.md
        heading: Installing and Running Challenges
      estimated_minutes: 60
      completion_criteria: Run or inspect one challenge notebook and one matching unit test locally.
      suggested_order: 3
      depends_on:
      - ciu-choose-primary-language
      difficulty:
        level: beginner
        score: 1
      cognitive_load: low
    - id: icc-learn-notebook-structure
      title: Learn the challenge notebook structure
      type:
        category: reading
        medium: markdown
        interaction: passive
      source:
        repo: interactive-coding-challenges
        path: README.md
        heading: Notebook Structure
      estimated_minutes: 45
      completion_criteria: Explain how problem statement, constraints, tests, algorithm notes, and code sections fit together.
      suggested_order: 4
      depends_on:
      - icc-set-up-coding-challenge-workflow
      difficulty:
        level: beginner
        score: 1
      cognitive_load: low
    - id: ie-create-study-cadence
      title: Create a repeatable daily study cadence
      type:
        category: checkpoint
        medium: manifest
        interaction: reflective
      inferred: true
      source:
        repo: coding-interview-university
        path: README.md
        heading: The Daily Plan
      estimated_minutes: 90
      completion_criteria: Define flexible availability windows for reading, implementation, review, and mock interview work.
      suggested_order: 5
      depends_on:
      - icc-learn-notebook-structure
      difficulty:
        level: beginner
        score: 1
      cognitive_load: low
    - id: ie-baseline-diagnostic
      title: Complete a baseline diagnostic
      type:
        category: checkpoint
        medium: manifest
        interaction: reflective
      inferred: true
      source:
        repo: interactive-coding-challenges
        path: README.md
        heading: Challenges
      estimated_minutes: 270
      completion_criteria: Attempt five mixed easy challenges, record pass rate, timing, and topic gaps.
      suggested_order: 6
      depends_on:
      - ie-create-study-cadence
      difficulty:
        level: beginner
        score: 1
      cognitive_load: high
    suggested_order: 1
    depends_on: []
  - id: ie-module-complexity-and-problem-solving
    name: Big-O and Problem Solving
    description: Build the complexity vocabulary and repeatable approach used in coding interviews.
    difficulty:
      level: beginner
      score: 1
    tags:
    - big-o
    - complexity
    - analysis
    - problem-solving
    prerequisites:
